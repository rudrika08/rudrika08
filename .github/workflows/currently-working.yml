name: Update Currently Working Repo

on:
  schedule:
    # Runs every 15 minutes
    - cron: "*/15 * * * *"

  # Allows you to run it manually
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ─────────────────────────────────────────────
      # 1. Checkout profile repository
      # ─────────────────────────────────────────────

      - name: Checkout profile repository
        uses: actions/checkout@v5

      # ─────────────────────────────────────────────
      # 2. Find repository with latest commit
      # ─────────────────────────────────────────────

      - name: Find latest repository
        id: repo
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}

        run: |

          echo "🔍 Finding latest repository..."

          gh api graphql \
            -f query='
            query($login: String!) {

              user(login: $login) {

                repositories(
                  first: 100
                  ownerAffiliations: OWNER
                  orderBy: {
                    field: UPDATED_AT
                    direction: DESC
                  }
                ) {

                  nodes {

                    name
                    url
                    isArchived
                    isFork

                    defaultBranchRef {

                      target {

                        ... on Commit {
                          committedDate
                        }

                      }

                    }

                  }

                }

              }

            }' \
            -F login="rudrika08" > repos.json


          # Find the repository with the newest commit
          cat repos.json | jq -r '

            .data.user.repositories.nodes[]

            | select(.name != "rudrika08")

            | select(.isArchived == false)

            | select(.isFork == false)

            | select(
                .defaultBranchRef.target.committedDate != null
              )

            | [
                .defaultBranchRef.target.committedDate,
                .name,
                .url
              ]

            | @tsv

          ' | sort -r | head -1 > latest.txt


          # Extract values
          REPO_NAME=$(cut -f2 latest.txt)
          REPO_URL=$(cut -f3 latest.txt)
          COMMIT_DATE=$(cut -f1 latest.txt)


          echo "repo=$REPO_NAME" >> "$GITHUB_OUTPUT"
          echo "url=$REPO_URL" >> "$GITHUB_OUTPUT"
          echo "date=$COMMIT_DATE" >> "$GITHUB_OUTPUT"


          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 CURRENTLY WORKING ON"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Repository : $REPO_NAME"
          echo "Last commit: $COMMIT_DATE"
          echo "URL        : $REPO_URL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


      # ─────────────────────────────────────────────
      # 3. Update README
      # ─────────────────────────────────────────────

      - name: Update README
        env:
          REPO_NAME: ${{ steps.repo.outputs.repo }}
          REPO_URL: ${{ steps.repo.outputs.url }}
          COMMIT_DATE: ${{ steps.repo.outputs.date }}

        run: |

          python3 <<'PY'

          import os
          import re
          from datetime import datetime


          # Get repository information
          repo_name = os.environ["REPO_NAME"]
          repo_url = os.environ["REPO_URL"]
          commit_date = os.environ["COMMIT_DATE"]


          # Convert commit date
          date = datetime.fromisoformat(
              commit_date.replace("Z", "+00:00")
          ).strftime("%d %b %Y")


          # ─────────────────────────────────────────
          # Create dynamic README section
          # ─────────────────────────────────────────

          replacement = f"""<!-- CURRENT_REPO:START -->

          <a href="{repo_url}">

            <img
              src="https://img.shields.io/badge/🟢%20ACTIVE-CURRENTLY%20WORKING%20ON-2ea043?style=for-the-badge&labelColor=161b22"
              alt="Currently Working On"
            />

          </a>

          <br><br>

          <h2>
            💻 <a href="{repo_url}">{repo_name}</a>
          </h2>

          <p>
            ⚡ Building • Improving • Deploying
          </p>

          <p>
            🕐 <b>Last commit:</b> {date}
          </p>

          <p>
            <a href="{repo_url}">
              <img
                src="https://img.shields.io/badge/View%20Repository-%E2%86%92-21262d?style=flat-square"
                alt="View Repository"
              />
            </a>
          </p>

          <!-- CURRENT_REPO:END -->"""


          # ─────────────────────────────────────────
          # Read README
          # ─────────────────────────────────────────

          with open(
              "README.md",
              "r",
              encoding="utf-8"
          ) as file:

              readme = file.read()


          # ─────────────────────────────────────────
          # Find dynamic section
          # ─────────────────────────────────────────

          pattern = (
              r"<!-- CURRENT_REPO:START -->"
              r".*?"
              r"<!-- CURRENT_REPO:END -->"
          )


          updated = re.sub(
              pattern,
              replacement,
              readme,
              flags=re.DOTALL
          )


          # ─────────────────────────────────────────
          # Make sure section exists
          # ─────────────────────────────────────────

          if updated == readme:

              print(
                  "❌ CURRENT_REPO section was not found!"
              )

              exit(1)


          # ─────────────────────────────────────────
          # Write updated README
          # ─────────────────────────────────────────

          with open(
              "README.md",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(updated)


          print("")
          print("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━")
          print("✅ README UPDATED")
          print("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━")
          print(f"Repository : {repo_name}")
          print(f"Last commit: {date}")
          print("━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━")

          PY


      # ─────────────────────────────────────────────
      # 4. Commit README changes
      # ─────────────────────────────────────────────

      - name: Commit README changes
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add README.md


          # Don't create a commit if nothing changed
          if git diff --cached --quiet; then

            echo "ℹ️ No README changes required."

            exit 0

          fi


          git commit \
            -m "chore: update currently working repo"


          git push
